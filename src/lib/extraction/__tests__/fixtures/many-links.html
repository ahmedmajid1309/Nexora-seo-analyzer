<!doctype html>
<html lang="en">
  <head>
    <title>Many Links</title>
  </head>
  <body>
    <a href="https://example.com/1">Link 1</a>
    <a href="https://example.com/2" rel="nofollow">Link 2</a>
    <a href="https://example.com/3" target="_blank" rel="noopener">Link 3</a>
    <a href="https://example.com/4" title="Link Four">Link 4</a>
    <a href="https://example.com/5" download>Link 5</a>
    <a href="https://example.com/6" hreflang="en">Link 6</a>
    <a href="https://example.com/7" media="print">Link 7</a>
    <a href="https://external.com/page">External Link</a>
    <a href="#section">Skip Link</a>
    <a href="mailto:user@example.com">Contact</a>
    <area href="https://example.com/area" alt="Area link" />
  </body>
</html>
