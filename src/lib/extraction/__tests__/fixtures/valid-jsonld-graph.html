<!doctype html>
<html lang="en">
  <head>
    <title>JSON-LD @graph</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          { "@type": "WebSite", "name": "My Site" },
          { "@type": "WebPage", "name": "My Page" }
        ]
      }
    </script>
  </head>
  <body>
    <p>JSON-LD with @graph.</p>
  </body>
</html>
