<!doctype html>
<html lang="en">
  <head>
    <title>Relative URLs</title>
  </head>
  <body>
    <a href="/relative-path">Relative path</a>
    <a href="relative-no-slash">Relative no slash</a>
    <a href="#fragment-only">Fragment only</a>
    <a href="https://example.com/absolute">Absolute HTTPS</a>
    <a href="http://example.com/absolute-http">Absolute HTTP</a>
    <a href="mailto:test@example.com">Email</a>
    <a href="tel:+1234567890">Phone</a>
    <a href="javascript:void(0)">JavaScript</a>
    <a href="data:text/plain,hello">Data URI</a>
    <a href="">Empty href</a>
    <a href="ftp://files.example.com">FTP scheme</a>
    <a href="not:a:valid:url">Malformed</a>
  </body>
</html>
