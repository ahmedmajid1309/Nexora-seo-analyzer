<!doctype html>
<html lang="en">
  <head>
    <title>Explicit Labels</title>
  </head>
  <body>
    <form action="/submit" method="post" autocomplete="on" novalidate>
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" placeholder="Enter username" required />
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required disabled />
      <label for="message">Message:</label>
      <textarea id="message" name="message" placeholder="Write message"></textarea>
      <label for="country">Country:</label>
      <select id="country" name="country">
        <option value="US">USA</option>
      </select>
      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
    </form>
  </body>
</html>
