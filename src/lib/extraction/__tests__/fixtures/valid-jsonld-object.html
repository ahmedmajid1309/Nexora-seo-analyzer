<!doctype html>
<html lang="en">
  <head>
    <title>JSON-LD Object</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Test Page",
        "description": "A valid JSON-LD object",
        "url": "https://example.com/test"
      }
    </script>
  </head>
  <body>
    <p>Single JSON-LD object.</p>
  </body>
</html>
